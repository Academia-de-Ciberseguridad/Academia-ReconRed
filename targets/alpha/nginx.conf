# =============================================================================
# nginx.conf — Objetivo ALPHA (172.30.0.21)
# Dos vhosts:
#   :80   -> web principal "RECON Corp" (sirve / y /robots.txt, cabecera flag)
#   :8080 -> panel nginx (pista evidente de que el servicio es nginx, M03)
# =============================================================================

# Proceso worker no privilegiado; el master corre como root para abrir :80/:8080.
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;

    sendfile        on;
    keepalive_timeout  65;

    # Exponemos la version exacta en la cabecera "Server" para que nmap -sV
    # la detecte (didactico). server_tokens on es el valor por defecto.
    server_tokens on;

    # -------------------------------------------------------------------------
    # Vhost :80 — Web principal "RECON Corp"
    # -------------------------------------------------------------------------
    server {
        listen       80 default_server;
        server_name  alpha recon-corp;

        root   /usr/share/nginx/html;
        index  index.html;

        # Flag de la Mision M02, visible en cabecera para banner grabbing
        # (curl -I) y para nmap con scripts http-headers.
        add_header X-Recon-Flag "RECON{w3b_r3con_h0st_alph4}";

        location / {
            try_files $uri $uri/ =404;
        }

        # robots.txt servido como texto plano; esconde una pista (el flag).
        location = /robots.txt {
            default_type text/plain;
            try_files /robots.txt =404;
        }
    }

    # -------------------------------------------------------------------------
    # Vhost :8080 — "Panel" nginx (pista de version; respuesta M03 = nginx)
    # -------------------------------------------------------------------------
    server {
        listen       8080;
        server_name  alpha-panel;

        root   /usr/share/nginx/panel;
        index  index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
