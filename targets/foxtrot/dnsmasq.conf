# =============================================================================
# dnsmasq.conf — Objetivo FOXTROT (172.30.0.26)
# Proposito didactico: servir DNS REAL para practicar -sU, NSE (dns-*) y la
# extraccion de un registro TXT con el flag de la mision M09.
#
# El servicio se arranca desde entrypoint.sh (NO usamos modo daemon aqui; lo
# lanzamos nosotros en segundo plano y comprobamos que escuche 53 udp/tcp).
# =============================================================================

# --- Aislamiento: servidor DNS autoritario "cerrado" para el laboratorio -----
# no-resolv  : no leer /etc/resolv.conf ni reenviar a resolvers externos.
# no-hosts   : ignorar /etc/hosts del contenedor (solo respondemos lo definido aqui).
# domain     : dominio por defecto del laboratorio.
no-resolv
no-hosts
domain=recon.lab

# --- Escucha en todas las interfaces, 53 udp y 53 tcp ------------------------
# listen-address=0.0.0.0 obliga a escuchar en todas las IPv4 del contenedor.
# bind-interfaces evita el bind comodin y ata el socket a las interfaces reales,
# lo que hace el comportamiento mas predecible en el laboratorio.
listen-address=0.0.0.0
bind-interfaces

# --- Trazabilidad: registrar las consultas (util para el alumno/instructor) --
log-queries
log-facility=-

# --- Zona recon.lab: el premio de M09 ----------------------------------------
# Registro TXT con el flag. Se obtiene con:
#   dig @172.30.0.26 flag.recon.lab TXT
#   nmap -sU -p53 --script dns-* 172.30.0.26
txt-record=flag.recon.lab,"RECON{udp_dns_txt_3num3r4t3d}"

# --- Registros A de practica (enumeracion DNS) -------------------------------
# Permiten practicar resolucion directa y NSE (dns-brute, dns-srv-enum, etc.).
# Coinciden con las IPs reales de los objetivos del laboratorio (ver LAB-SPEC).
address=/alpha.recon.lab/172.30.0.21
address=/bravo.recon.lab/172.30.0.22
address=/charlie.recon.lab/172.30.0.23
address=/delta.recon.lab/172.30.0.24
address=/echo.recon.lab/172.30.0.25
address=/foxtrot.recon.lab/172.30.0.26
address=/hotel.recon.lab/172.30.0.27
